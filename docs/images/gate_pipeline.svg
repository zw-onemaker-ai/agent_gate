<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F4E79"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B23B3B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Per-Agent Quality Gate Pipeline</text>
  <text x="500" y="50" text-anchor="middle" font-size="10.5" fill="#6B7A8A">Five checks per handoff — any failure routes back to the faulting agent</text>

  <!-- FAIL drops + bus + loopback (drawn first, under nodes) -->
  <line x1="239" y1="152" x2="239" y2="210" stroke="#B23B3B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="379" y1="152" x2="379" y2="210" stroke="#B23B3B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="519" y1="152" x2="519" y2="210" stroke="#B23B3B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="659" y1="152" x2="659" y2="210" stroke="#B23B3B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="799" y1="152" x2="799" y2="210" stroke="#B23B3B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="99" y1="210" x2="799" y2="210" stroke="#B23B3B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="99" y1="210" x2="99" y2="156" stroke="#B23B3B" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrRed)"/>
  <text x="449" y="230" text-anchor="middle" font-size="9.5" fill="#B23B3B">FAIL · oriented loopback (retry the faulting agent, never blind restart)</text>

  <!-- A: Agent Output -->
  <rect x="40" y="96" width="118" height="56" fill="#FBFBFD" stroke="#9AA7B5" stroke-width="1"/>
  <text x="99" y="119" text-anchor="middle" font-size="10" font-weight="bold" fill="#2C3E50">Agent Output</text>
  <text x="99" y="135" text-anchor="middle" font-size="8.5" fill="#6B7A8A">unverified</text>

  <!-- G1 -->
  <rect x="180" y="96" width="118" height="56" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1"/>
  <text x="239" y="119" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F4E79">G1 · File Existence</text>
  <text x="239" y="135" text-anchor="middle" font-size="8.5" fill="#6B7A8A">files exist, non-empty</text>

  <!-- G2 -->
  <rect x="320" y="96" width="118" height="56" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1"/>
  <text x="379" y="119" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1F4E79">G2 · EXIT-code</text>
  <text x="379" y="135" text-anchor="middle" font-size="8.5" fill="#6B7A8A">unforgeable EXIT:0</text>

  <!-- G3 -->
  <rect x="460" y="96" width="118" height="56" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1"/>
  <text x="519" y="119" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F4E79">G3 · Cross-verify</text>
  <text x="519" y="135" text-anchor="middle" font-size="8.5" fill="#6B7A8A">claimed files on disk</text>

  <!-- G4 -->
  <rect x="600" y="96" width="118" height="56" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1"/>
  <text x="659" y="119" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F4E79">G4 · CPOO Score</text>
  <text x="659" y="135" text-anchor="middle" font-size="8.5" fill="#6B7A8A">prompt quality ≥ 80</text>

  <!-- G5 -->
  <rect x="740" y="96" width="118" height="56" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1"/>
  <text x="799" y="119" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1F4E79">G5 · Tool Allowlist</text>
  <text x="799" y="135" text-anchor="middle" font-size="8.5" fill="#6B7A8A">risk-tiered control</text>

  <!-- D: Downstream -->
  <rect x="880" y="96" width="118" height="56" fill="#FBFBFD" stroke="#9AA7B5" stroke-width="1"/>
  <text x="939" y="119" text-anchor="middle" font-size="10" font-weight="bold" fill="#2C3E50">Downstream</text>
  <text x="939" y="135" text-anchor="middle" font-size="8.5" fill="#6B7A8A">verified input</text>

  <!-- forward arrows -->
  <line x1="158" y1="124" x2="178" y2="124" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="298" y1="124" x2="318" y2="124" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="438" y1="124" x2="458" y2="124" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="578" y1="124" x2="598" y2="124" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="718" y1="124" x2="738" y2="124" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="858" y1="124" x2="878" y2="124" stroke="#1F4E79" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="868" y="114" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1F6F43">PASS</text>

  <!-- Legend -->
  <line x1="340" y1="296" x2="380" y2="296" stroke="#1F4E79" stroke-width="1.3"/>
  <text x="386" y="299" font-size="9.5" fill="#5A6B7B">data flow</text>
  <line x1="468" y1="296" x2="508" y2="296" stroke="#B23B3B" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="514" y="299" font-size="9.5" fill="#5A6B7B">control flow (FAIL)</text>
</svg>
